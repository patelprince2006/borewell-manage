services:
  - type: web
    name: borewell
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: water-supply-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: water-supply-db
    databaseName: borewell_water_db
    user: borewell_user
    plan: free
